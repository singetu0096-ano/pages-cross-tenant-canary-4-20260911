name: Pages owned-account baseline

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-owned-account-baseline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Build minimal Pages artifact
        shell: python
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/artifact.tar
        run: |
          import io
          import os
          import tarfile

          directory = tarfile.TarInfo("site")
          directory.type = tarfile.DIRTYPE
          directory.mode = 0o755

          files = {
              "site/index.html": b"GitHub Pages owned-account isolation canary\n",
              "site/b-owned-e73fa565726a4fc145906eb0.txt": (
                  b"BB_CT_B_OWNER_e73fa565726a4fc145906eb0\n"
              ),
          }

          with tarfile.open(os.environ["ARTIFACT_PATH"], "w", format=tarfile.GNU_FORMAT) as archive:
              archive.addfile(directory)
              for name, body in files.items():
                  item = tarfile.TarInfo(name)
                  item.mode = 0o644
                  item.size = len(body)
                  archive.addfile(item, io.BytesIO(body))

      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
